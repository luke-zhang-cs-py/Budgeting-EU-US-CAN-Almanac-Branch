<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wallet — sign in</title>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
/* The login page carries its own handful of rules rather than adding a
   variant of every card style to the main stylesheet for one screen. */
.gate { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
.gateCard {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-2xl); padding: var(--space-7) var(--space-7); width: 100%; max-width: 380px;
}
.gateCard h1 { margin: 0 0 var(--space-2); font: var(--weight-display) var(--text-xl)/1 var(--font-display); }
.gateCard .sub { margin: 0 0 var(--space-5); color: var(--color-text-muted); font-size: var(--text-sm); }
.gateCard label { display: block; margin-bottom: var(--space-4); }
.gateCard label span {
  display: block; margin-bottom: var(--space-1); color: var(--color-text-muted);
  font-size: var(--text-sm); text-transform: uppercase; letter-spacing: var(--tracking-wide);
}
.gateCard input[type="password"] { width: 100%; }
.gateCard button { width: 100%; }
.gateNote { margin: var(--space-5) 0 0; color: var(--color-text-subtle); font-size: var(--text-sm); }
.gateError {
  margin: 0 0 var(--space-4); padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg);
  background: var(--color-danger-subtle); color: var(--color-danger); font-size: var(--text-sm);
}
</style>
</head>
<body>
<main class="gate">
  <button type="button" id="themeBtn" class="ghost themeToggle" hidden
            aria-label="Switch to light theme" title="Switch to light theme"><svg class="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <form class="gateCard" method="post" action="{{ url_for('log_in') }}"
        autocomplete="on">
    <h1>Wallet</h1>
    <p class="sub">Euro spending, in Canadian and US dollars</p>

    {% if error %}<p class="gateError" role="alert">{{ error }}</p>{% endif %}

    <!-- The token also guards this form. A forged login does little harm,
         but the door with the lock on it should have the lock on it. -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">

    <label>
      <span>Password</span>
      <input type="password" name="password" required autofocus
             autocomplete="current-password"
             {% if wait %}disabled{% endif %}>
    </label>

    <button type="submit" {% if wait %}disabled{% endif %}>Sign in</button>

    <p class="gateNote">
      One password, no account. It is checked against a scrypt hash set in
      the environment — the password itself is not stored anywhere, so there
      is nothing here to reset it with.
    </p>
  </form>
</main>
</body>
</html>
